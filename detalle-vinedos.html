
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DERIVA | Viñedos al atardecer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

  <style>

    /* DISEÑO GENERAL */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #e8ded0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: #302920;
    }

    .app {
      width: 390px;
      max-width: 100%;
      min-height: 780px;
      margin: 20px auto;
      background: #f9f1e5;
      border: 2px solid #493b30;
      border-radius: 28px;
      overflow: hidden;
    }

    /* BARRA SUPERIOR */

    .status {
      height: 27px;
      padding: 8px 19px;
      font: bold 11px Arial, sans-serif;
      display: flex;
      justify-content: space-between;
    }

    /* FOTO PRINCIPAL */

    .hero {
      height: 245px;
      width: 100%;
      position: relative;
      overflow: hidden;
      background-color: #a8a087;
    }

    .hero img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .back {
      position: absolute;
      top: 15px;
      left: 20px;
      color: white;
      text-decoration: none;
      font-size: 30px;
      text-shadow: 0 1px 5px #333;
      z-index: 2;
    }

    .bookmark {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 24px;
      height: 30px;
      fill: none;
      stroke: white;
      stroke-width: 2;
      z-index: 2;
    }

    /* INFORMACIÓN */

    .content {
      padding: 17px 22px 30px;
    }

    h1 {
      font-size: 35px;
      font-weight: 500;
      line-height: 1;
      margin-bottom: 7px;
    }

    .location {
      color: #792632;
      font: 10px Georgia, serif;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }

    /* ETIQUETAS */

    .tags {
      display: flex;
      gap: 7px;
      margin-bottom: 18px;
    }

    .tags span {
      border: 1px solid #d9c6aa;
      padding: 4px 11px;
      border-radius: 20px;
      font-size: 14px;
      white-space: nowrap;
    }

    .tags span:first-child {
      background: #c5a984;
    }

    /* DESCRIPCIÓN */

    .description {
      font-size: 20px;
      line-height: 1.13;
      margin-bottom: 21px;
    }

    /* ÍCONOS FINITOS */

    .detail-features {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #ddcdb6;
      border-bottom: 1px solid #ddcdb6;
      padding: 18px 0;
      margin-bottom: 25px;
    }

    .feature {
      width: 33.33%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      padding: 0 5px;
    }

    .feature:not(:last-child) {
      border-right: 1px solid #ddcdb6;
    }

    .feature svg {
      width: 39px;
      height: 34px;
      fill: none;
      stroke: #302920;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .feature span {
      font-size: 15px;
      white-space: nowrap;
    }

    /* ENLACE AL MENÚ */

    .menu-link {
      display: block;
      text-align: center;
      color: #842632;
      text-decoration: none;
      font-size: 19px;
      margin: 18px 0 24px;
    }

    /* BOTÓN RESERVAR */

    .reserve-button {
      display: block;
      background: #842632;
      color: white;
      text-decoration: none;
      text-align: center;
      border-radius: 30px;
      padding: 13px;
      font-size: 19px;
    }

    /* ADAPTACIÓN A CELULAR */

    @media (max-width: 480px) {
      body {
        background: #f9f1e5;
      }

      .app {
        width: 100%;
        min-height: 100dvh;
        margin: 0;
        border: none;
        border-radius: 0;
      }
    }

  </style>
</head>

<body>

  <div class="app">

    <!-- BARRA SUPERIOR -->

    <div class="status">
      <span>9:41</span>
      <span>● ▰ ▰</span>
    </div>

    <!-- FOTO PRINCIPAL -->

    <div class="hero">

      <img
        src="imagenes/olivos.jpg"
        alt="Viñedos al atardecer en Mendoza"
      >

      <a href="experiencias.html" class="back">‹</a>

      <svg class="bookmark" viewBox="0 0 24 30">
        <path d="M5 3 H19 V27 L12 21 L5 27 Z"/>
      </svg>

    </div>

    <!-- CONTENIDO -->

    <div class="content">

      <h1>Viñedos al atardecer</h1>

      <p class="location">
        ♥ VALLE DE UCO, MENDOZA
      </p>

      <!-- ETIQUETAS -->

      <div class="tags">
        <span>Viñedo</span>
        <span>En grupo</span>
        <span>♡ 4 horas</span>
      </div>

      <!-- DESCRIPCIÓN -->

      <p class="description">
        Una experiencia sensorial entre viñedos,
        con degustación de vinos, productos locales
        y la magia del atardecer.
      </p>

      <!-- ÍCONOS -->

      <div class="detail-features">

        <!-- DEGUSTACIÓN -->

        <div class="feature">
          <svg viewBox="0 0 64 44">
            <path d="M23 5 L41 5 L39 21 Q32 29 25 21 Z"/>
            <path d="M32 27 L32 38"/>
            <path d="M23 39 L41 39"/>
          </svg>
          <span>Degustación</span>
        </div>

        <!-- ATARDECER -->

        <div class="feature">
          <svg viewBox="0 0 64 44">
            <path d="M8 32 H56"/>
            <path d="M20 32 A12 12 0 0 1 44 32"/>
            <path d="M32 5 V12"/>
            <path d="M12 15 L17 20"/>
            <path d="M52 15 L47 20"/>
            <path d="M10 26 H16"/>
            <path d="M48 26 H54"/>
          </svg>
          <span>Atardecer</span>
        </div>

        <!-- VINOS DE AUTOR -->

        <div class="feature">
          <svg viewBox="0 0 64 44">
            <path d="M23 5 L41 5 L39 21 Q32 29 25 21 Z"/>
            <path d="M32 27 L32 38"/>
            <path d="M23 39 L41 39"/>
          </svg>
          <span>Vinos de autor</span>
        </div>

      </div>

      <!-- MENÚ -->

      <a href="menu.html" class="menu-link">
        Ver ingredientes tipicos →
      </a>

      <!-- RESERVAR -->

      <a
        href="reservar.html?experiencia=vinedos"
        class="reserve-button"
      >
        Reservar experiencia →
      </a>

    </div>

  </div>

</body>
</html>
